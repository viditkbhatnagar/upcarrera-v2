# upCarrera reverse proxy — admin + admissions on one droplet.
#
# The web app is a STATIC Vite SPA (apps/web/dist) served directly by nginx; only
# the Nest API runs as a Node process (127.0.0.1:3000). Both hostnames serve the
# SAME SPA build (server-side RBAC segments admins vs counsellors), and each
# proxies its OWN /api, so the browser bundle calls the API same-origin via a
# relative VITE_API_URL=/api — no CORS configuration needed.
#
# Install on the droplet:
#   sudo cp deploy/nginx/upcarrera.conf /etc/nginx/sites-available/upcarrera.conf
#   sudo ln -sf /etc/nginx/sites-available/upcarrera.conf /etc/nginx/sites-enabled/upcarrera.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.upcarrera.com -d admissions.upcarrera.com
# certbot rewrites this file to add the TLS listeners and the 80->443 redirect.

upstream upcarrera_api { server 127.0.0.1:3000; keepalive 16; }

server {
  listen 80;
  listen [::]:80;
  server_name admin.upcarrera.com admissions.upcarrera.com;

  # Static SPA build produced by deploy/deploy.sh (pnpm build -> apps/web/dist).
  root /opt/upcarrera/apps/web/dist;
  index index.html;

  client_max_body_size 25m;

  # Self-serve online application submit (public-intake). Exact match beats the
  # ^~ /api/public/ prefix below, so this wins for the submit only. It needs a
  # larger body cap than the 6m default (photo + signature + documents) and a
  # TIGHTER rate burst than browsing — the app also throttles per IP + per user.
  location = /api/public/intake/applications {
    limit_req zone=applicant burst=8 nodelay;
    limit_req_status 429;
    client_max_body_size 32m;
    proxy_pass http://upcarrera_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Self-serve online application FORM (static page — Naji's HTML). noindex +
  # no-store + anti-clickjacking, like /apply. The file is deployed to
  # /opt/upcarrera/deploy/enroll/index.html (see deploy/enroll/README.md).
  location = /enroll {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    default_type text/html;
    alias /opt/upcarrera/deploy/enroll/index.html;
  }

  # Public applicant API — coarse per-IP flood backstop (the app throttles per
  # session). Needs `limit_req_zone ... zone=applicant ...;` in http{} — ship it
  # via /etc/nginx/conf.d/upcarrera-applicant.conf (see deploy/nginx/ws5-applicant.conf).
  # ^~ beats the plain /api/ prefix, so /api/public/* lands here.
  location ^~ /api/public/ {
    limit_req zone=applicant burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 6m;
    proxy_pass http://upcarrera_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # API — proxy_pass with no URI part preserves the full path, so /api/... reaches
  # the Nest app unchanged (global 'api' prefix in main.ts).
  location /api/ {
    proxy_pass http://upcarrera_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Content-hashed assets — safe to cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Public student application form (WS5). noindex + no-store + anti-clickjacking.
  # Exact /apply and /apply/* only — must NOT match the staff /applications route.
  location = /apply {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }
  location ^~ /apply/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }

  # SPA fallback — client-side routing: any unknown path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
