# ============================================================================
# WS5 (AP03) — nginx additions for the PUBLIC applicant form.  DEPLOY-TIME ONLY.
# This is a SNIPPET to MERGE into deploy/nginx/upcarrera.conf — it is not loaded
# on its own. Do NOT apply it automatically; a human merges + reloads nginx:
#
#   # 1. add the limit_req_zone to the http{} block (see §1)
#   # 2. add the two location blocks inside the admissions server{} (see §2, §3)
#   sudo nginx -t && sudo systemctl reload nginx
#
# The raw magic-link token travels only in the URL #fragment, which browsers
# never send to the server, so it never reaches these access logs. These rules add
# defence-in-depth for the unauthenticated surface.
# ============================================================================


# ---------------------------------------------------------------------------
# §1. http{} block  (e.g. /etc/nginx/nginx.conf, inside `http { ... }`)
# ---------------------------------------------------------------------------
# Per-IP rate zone for the public API. 10 MB holds ~160k IPs.
#
# CGNAT NOTE: many students share one mobile-carrier IP, so a per-IP limit is a
# COARSE BACKSTOP ONLY — the REAL control is the app-level throttle in Nest
# (per-IP 10/min on session creation, and PER-SESSION limits on every other
# public route). Keep this rate GENEROUS so a shared carrier IP is not locked out.
# The AP03 design's stricter baseline is `rate=20r/m`; raise it (as below) when
# real CGNAT traffic trips it.
limit_req_zone $binary_remote_addr zone=applicant:10m rate=120r/m;


# ---------------------------------------------------------------------------
# §2. Inside the admissions server{} block — the public form shell.
# `=` and `^~` make these win over the generic `location /` SPA fallback.
# ---------------------------------------------------------------------------
location = /apply {
  # Never leak the (fragment) URL to any third party, never allow framing, keep it
  # out of search indexes, and never cache the shell (it is per-applicant).
  add_header Referrer-Policy        "no-referrer"          always;
  add_header X-Frame-Options        "DENY"                 always;
  add_header X-Robots-Tag           "noindex, nofollow"    always;
  add_header X-Content-Type-Options "nosniff"              always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Cache-Control          "no-store"             always;
  # SECURITY MEDIUM 1: keep /index.html the FALLBACK but serve it as a FILE in THIS
  # location (non-final try_files arg) so the add_header directives above apply.
  # `try_files $uri /index.html;` would internal-redirect the fallback into
  # `location /`, dropping every header on the /apply response.
  try_files $uri /index.html =404;
}

location ^~ /apply/ {
  add_header Referrer-Policy        "no-referrer"          always;
  add_header X-Frame-Options        "DENY"                 always;
  add_header X-Robots-Tag           "noindex, nofollow"    always;
  add_header X-Content-Type-Options "nosniff"              always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Cache-Control          "no-store"             always;
  # SECURITY MEDIUM 1: keep /index.html the FALLBACK but serve it as a FILE in THIS
  # location (non-final try_files arg) so the add_header directives above apply.
  # `try_files $uri /index.html;` would internal-redirect the fallback into
  # `location /`, dropping every header on the /apply response.
  try_files $uri /index.html =404;
}


# ---------------------------------------------------------------------------
# §3. Inside the admissions server{} block — the public API.
# MUST be declared BEFORE the generic `location /api/ { ... }` so it wins
# (^~ stops regex/longest-prefix evaluation once matched).
# ---------------------------------------------------------------------------
location ^~ /api/public/ {
  # Coarse per-IP backstop (burst smooths legitimate bursts; nodelay serves the
  # burst immediately). The app-level per-session throttle is the real limit.
  limit_req zone=applicant burst=60 nodelay;
  limit_req_status 429;

  # Uploads are capped at 5 MB per file in the app; allow a little multipart
  # overhead but far below the 25 MB the staff API accepts.
  client_max_body_size 6m;

  proxy_pass http://upcarrera_api;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}


# ---------------------------------------------------------------------------
# §4. Recommended baseline security headers for the whole admissions server{}
# (certbot adds Strict-Transport-Security when it provisions TLS).
# ---------------------------------------------------------------------------
